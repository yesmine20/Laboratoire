<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Members</mat-card-title>
    <mat-card-subtitle>{{ Nb_Members }}</mat-card-subtitle>
  </mat-card-header>
</mat-card>

<div class="chart-wrapper">
  <canvas baseChart [type]="'pie'" [datasets]="chartData" axe des y [labels]="chartLabels" axe des x
    [options]="chartOptions">
  </canvas>
</div>

<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Articles</mat-card-title>
    <mat-card-subtitle>0</mat-card-subtitle>
  </mat-card-header>
</mat-card>

<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Tools</mat-card-title>
    <mat-card-subtitle>0</mat-card-subtitle>
  </mat-card-header>
</mat-card>

<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Events</mat-card-title>
    <mat-card-subtitle>0</mat-card-subtitle>
  </mat-card-header>
</mat-card>
